    var NEWTON_ITERATIONS = 4;
    var NEWTON_MIN_SLOPE = .001;
    var SUBDIVISION_PRECISION = 1e-7;
    var SUBDIVISION_MAX_ITERATIONS = 10;
    var kSplineTableSize = 11;
    var kSampleStepSize = 1 / (kSplineTableSize - 1);
    var float32ArraySupported = typeof Float32Array === "function";

    function A(e, t) {
      return 1 - 3 * t + 3 * e
    }

    function B(e, t) {
      return 3 * t - 6 * e
    }

    function C(e) {
      return 3 * e
    }

    function calcBezier(e, t, n) {
      return ((A(t, n) * e + B(t, n)) * e + C(t)) * e
    }

    function getSlope(e, t, n) {
      return 3 * A(t, n) * e * e + 2 * B(t, n) * e + C(t)
    }

    function binarySubdivide(e, t, n, o, a) {
      var i, r, l = 0;
      do {
        r = t + (n - t) / 2;
        i = calcBezier(r, o, a) - e;
        if (i > 0) {
          n = r
        } else {
          t = r
        }
      } while (Math.abs(i) > SUBDIVISION_PRECISION && ++l < SUBDIVISION_MAX_ITERATIONS);
      return r
    }

    function newtonRaphsonIterate(e, t, n, o) {
      for (var a = 0; a < NEWTON_ITERATIONS; ++a) {
        var i = getSlope(t, n, o);
        if (i === 0) {
          return t
        }
        var r = calcBezier(t, n, o) - e;
        t -= r / i
      }
      return t
    }

    function LinearEasing(e) {
      return e
    }

    function bezier(e, t, n, o) {
      if (!(0 <= e && e <= 1 && 0 <= n && n <= 1)) {
        throw new Error("bezier x values must be in [0, 1] range")
      }
      if (e === t && n === o) {
        return LinearEasing
      }
      var a = float32ArraySupported ? new Float32Array(kSplineTableSize) : new Array(kSplineTableSize);
      for (var i = 0; i < kSplineTableSize; ++i) {
        a[i] = calcBezier(i * kSampleStepSize, e, n)
      }

      function r(t) {
        var o = 0;
        var i = 1;
        var r = kSplineTableSize - 1;
        for (; i !== r && a[i] <= t; ++i) {
          o += kSampleStepSize
        }--i;
        var l = (t - a[i]) / (a[i + 1] - a[i]);
        var s = o + l * kSampleStepSize;
        var c = getSlope(s, e, n);
        if (c >= NEWTON_MIN_SLOPE) {
          return newtonRaphsonIterate(t, s, e, n)
        } else if (c === 0) {
          return s
        } else {
          return binarySubdivide(t, o, o + kSampleStepSize, e, n)
        }
      }
      return function e(n) {
        if (n === 0) {
          return 0
        }
        if (n === 1) {
          return 1
        }
        return calcBezier(r(n), t, o)
      }
    }

    function getPathD(e, t, n) {
      if (!t) {
        console.error("Points are undefined, can not generate path d");
        return ""
      }
      const o = t[0];
      if (!o) {
        return ""

      const a = "M " + o.mainPoint.x.getValueAtFrame(e) + " " + o.mainPoint.y.getValueAtFrame(e) + " " + getPathDCore(e, t, n);

    function getAbsolutePathD(e, t, n, o, a) {
      const i = "M " + (t[0].mainPoint.x.getValueAtFrame(e) + o) + " " + (t[0].mainPoint.y.getValueAtFrame(e) + a) + " " + this.getPathDCore(e, t, n);
      return i
    }

    function getInversedPathD(e, t, n, o, a) {
      const i = t[0].mainPoint.x.getValueAtFrame(e) + o;
      const r = t[0].mainPoint.y.getValueAtFrame(e) + a;
      const l = t[1].mainPoint.x.getValueAtFrame(e);
      const s = t[1].mainPoint.y.getValueAtFrame(e);
      const c = t[t.length - 1].mainPoint.x.getValueAtFrame(e);
      const u = t[t.length - 1].mainPoint.y.getValueAtFrame(e);
      let d = "";
      if (l < c && s > u) {
        d = "M 0 0 c 0 0, 2000 0, 2000 0 c 0 0, 0 2000, 0 2000 c 0 0, -2000 0, -2000 0 c 0 0, 0 -2000, 0 -2000 c 0 0, "
      } else {
        d = "M 0 0 c 0 0, 0 2000, 0 2000 c 0 0, 2000 0, 2000 0 c 0 0, 0 -2000, 0 -2000 c 0 0, -2000 0, -2000 0 c 0 0, "
      }
      d += "0 " + r + ", 0 " + r + " c 0 0, " + i + " 0, " + i + " 0 ";
      d += getPathDCore(e, t, n);
      return d
    }

    function getPathDCore(e, t, n) {
      let o = "";
      for (let n = 0; n < t.length - 1; n++) {
        const a = t[n - 1];
        const i = t[n];
        const r = t[n + 1];
        const l = {
          x: i.mainPoint.x.getValueAtFrame(e),
          y: i.mainPoint.y.getValueAtFrame(e)
        };
        if (a) {
          l.x -= a.mainPoint.x.getValueAtFrame(e);
          l.y -= a.mainPoint.y.getValueAtFrame(e)
        }
        const s = {
          x: r.mainPoint.x.getValueAtFrame(e) - i.mainPoint.x.getValueAtFrame(e),
          y: r.mainPoint.y.getValueAtFrame(e) - i.mainPoint.y.getValueAtFrame(e)
        };
        const c = i.outC ? i.outC.x.getValueAtFrame(e) : 0;
        const u = i.outC ? i.outC.y.getValueAtFrame(e) : 0;
        const d = r.inC ? r.inC.x.getValueAtFrame(e) : 0;
        const f = r.inC ? r.inC.y.getValueAtFrame(e) : 0;
        const m = s.x - l.x;
        const p = s.y - l.y;
        const y = l.x + m + d;
        const g = l.y + p + f;
        o += "c " + c + " " + u + ", " + y + " " + g + ", " + s.x + " " + s.y + " "
      }
      if (n) {
        const n = t[0];
        const a = t[t.length - 1];

          let r = {

          let l = {

            l.y = n.mainPoint.y.getValueAtFrame(e) - a.mainPoint.y.getValueAtFrame(e) + n.inC.y.getValueAtFrame(e)

          o += "c " + r.x + " " + r.y + ", " + l.x + " " + l.y + ", " + -t + " " + -i + " ";
          o += "Z"
        }

    function xmlToJson(e) {
      const t = new DOMParser;
      let n = e;
      if (typeof e === "string") {
        n = t.parseFromString(e, "text/xml")
      }
      var o = {};
      if (n.nodeType == 1) {
        if (n.attributes.length > 0) {
          o["@attributes"] = {};
          for (var a = 0; a < n.attributes.length; a++) {
            var i = n.attributes.item(a);
            o["@attributes"][i.nodeName] = i.nodeValue
          }
        }
      } else if (n.nodeType == 3) {
        o = n.nodeValue
      }
      if (n.hasChildNodes()) {
        for (var r = 0; r < n.childNodes.length; r++) {
          var l = n.childNodes.item(r);
          var s = l.nodeName;
          if (typeof o[s] == "undefined") {
            o[s] = xmlToJson(l)
          } else {
            if (typeof o[s].push == "undefined") {
              var c = o[s];
              o[s] = [];
              o[s].push(c)
            }
            o[s].push(xmlToJson(l))
          }
        }
      }
      return o
    }

    function base64ToArrayBuffer(e) {
      const t = window.atob(e);
      const n = t.length;
      const o = new Uint8Array(n);
      for (let e = 0; e < n; e++) {
        o[e] = t.charCodeAt(e)
      }
      return o.buffer

    function colorToCssString(e) {
      if (typeof e === "object") {
        return "rgba(" + e.r + ", " + e.g + ", " + e.b + ", " + e.a + ")"
      }
      return e
    }

    function buildCssGradient(e) {
      const {
        gradientType: t,
        degree: n,
        colorStops: o
      } = e;
      const a = t === "linear" ? `${180+n}deg` : "circle";
      const i = t === "linear" ? "linear-gradient" : "radial-gradient";
      if (o.length === 0) {
        return
      }
      if (o.length === 1) {
        return colorToCssString(o[0].color)
      }
      const r = o.slice().sort(((e, t) => e.step - t.step));
      return `${i}(${a}, ${r.map((e=>`${colorToCssString(e.color)} ${e.step}%`)).join(", ")})`
    }

    function colorToCssString2(e) {
      if (!e.isGradient) {
        return colorToCssString(e.color)

      return buildCssGradient(e)

    let readyCallbacks = [];

    let isInitialized = false;

    function initializeReadySystem() {
      if (isInitialized) return;
      isInitialized = true;
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", (() => {
          isDomReady = true;
          checkAndExecuteCallbacks()
        }))
      } else {
        isDomReady = true
      }
      if (document.readyState === "complete") {
        isWindowLoaded = true
      } else {
        window.addEventListener("load", (() => {
          isWindowLoaded = true;
          checkAndExecuteCallbacks()
        }))
      }
    }

    function checkAndExecuteCallbacks() {
      if (isDomReady && isWindowLoaded && isMainCompositionReady) {
        executeReadyCallbacks()
      }
    }

    function onReady(e) {
      if (!isInitialized) {
        initializeReadySystem()
      }
      if (isDomReady && isWindowLoaded && isMainCompositionReady) {
        e()
      } else {
        readyCallbacks.push(e)
      }
    }

    function setMainCompositionReady() {
      isMainCompositionReady = true;
      checkAndExecuteCallbacks()
    }

    function executeReadyCallbacks() {
      readyCallbacks.forEach((e => e()));
      readyCallbacks = []
    }

    function update(e) {
      onReady((() => {
        loopic.flags.update = true;
        if (!e) {
          console.log("No template data");
          return
        }
        try {
          let t = JSON.parse(e);
          for (const e in t) {
            const n = t[e];
            loopic.templateData[e] = n;
            try {
              loopic.fireUpdateItem(e, n, 0)
            } catch (t) {
              console.error("Error while updating item '" + e + "' with value '" + n + "'", t)
            }
          }
        } catch (t) {
          const n = xmlToJson(e);
          if (!n.templateData) {
            console.log("No parsed XML template data");
            return
          }
          let o = n.templateData.componentData;
          if (!o) {
            console.log("No parsed XML component data");
            return
          }
          if (!Array.isArray(o)) {
            o = [o]
          }
          for (const e of o) {
            const t = e["@attributes"].id;
            const n = e.data["@attributes"].value;
            loopic.templateData[t] = n
          }
          for (const e of o) {
            const t = e["@attributes"].id;
            const n = e.data["@attributes"].value;
            try {
              loopic.fireUpdateItem(t, n, 0)
            } catch (e) {
              console.error("Error while updating item '" + t + "' with value '" + n + "'", e)
            }
          }
        }
      }))
    }

    function updateTextFontSize(key, size) {
      if (size === undefined || size === null || size === "") return;
      const numSize = parseFloat(size);
      if (isNaN(numSize)) return;
      const elem = mainComposition.findElementByKey(key);
      if (elem && "TEXT" === elem.type) {
        if (elem.style && elem.style.fontSize) {
          elem.style.fontSize.value = numSize;
        }
        if (elem.style && elem.style.lineHeight) {
          elem.style.lineHeight.value = numSize;
        }
        if (elem.domNode) {
          elem.domNode.style.fontSize = numSize + "px";
          elem.domNode.style.lineHeight = numSize + "px";
        }
        if (typeof elem.squeeze === "function") {
          elem.squeeze();
        }
      }
    }

    async function fetchApiData() {
      try {
        const res = await fetch("http://localhost:8080/bar2line");
        if (res.ok) {
          const data = await res.json();
          const mapped = {
            _headtext: data.head,
            _line1: data.line1,
            _line2: data.line2,
            _mainbar: data.mainbar,
            _headbar: data.headbar
          };

          const headSize = data.head_size || data.head_fontsize || data.head_fontSize || data._headtext_fontsize || data._headtext_size;
          const line1Size = data.line1_size || data.line1_fontsize || data.line1_fontSize || data._line1_fontsize || data._line1_size;
          const line2Size = data.line2_size || data.line2_fontsize || data.line2_fontSize || data._line2_fontsize || data._line2_size;

          if (headSize !== undefined) mapped._headtext_fontsize = headSize;
          if (line1Size !== undefined) mapped._line1_fontsize = line1Size;
          if (line2Size !== undefined) mapped._line2_fontsize = line2Size;

          for (const k in mapped) {
            const val = mapped[k];
            if (val !== undefined) {
              loopic.templateData[k] = val;
              try {
                loopic.fireUpdateItem(k, val, 0);
              } catch (err) {
                console.error("Error updating item '" + k + "'", err);
              }
            }
          }
        }
      } catch (err) {
        console.error("Failed to fetch http://localhost:8080/bar2line", err);
      }
    }

      onReady((async () => {
        await fetchApiData();
        loopic.flags.play = true;
        loopic.firePlay()
      }))
    }
